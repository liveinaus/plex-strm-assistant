name: Publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - README.md
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: version
        run: |
          PREV=$(git show HEAD^:package.json | jq -r '.version' 2>/dev/null || echo "none")
          CURR=$(jq -r '.version' package.json)
          echo "previous=$PREV, current=$CURR"
          echo "value=$CURR" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$PREV" != "$CURR" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Assemble image tags
        id: tags
        if: steps.version.outputs.changed == 'true'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          GHCR_IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "tags<<EOF"
            echo "$GHCR_IMAGE:latest"
            echo "$GHCR_IMAGE:$VERSION"
            if [ -n "$DH_USER" ]; then
              echo "$DH_USER/plex-strm-assistant:latest"
              echo "$DH_USER/plex-strm-assistant:$VERSION"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.version.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.version.outputs.changed == 'true' && env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub Container Registry
        if: steps.version.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.version.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs on every push to main that touches package.json or README.md,
      # regardless of whether a new image version was published
      - name: Update Docker Hub overview
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/plex-strm-assistant
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
          # Rewrites relative links (docs/media-info.png, LICENSE) to absolute GitHub URLs
          enable-url-completion: true
